name: defrag
title: The disk defragmenter, mid-pass, with your photograph on the disk

# Saturated first, because the grid can only be as colourful as what it is
# matching against -- fourteen states is a small palette, and a pastel
# photograph lands most of itself on the greys between them.
#
# The window comes with the effect, so there is no 'maximised' here: adding one
# would put a second window around the first.

output:
  max_dim: 1280

effects:
  grade:
    saturation: 150
    contrast: 12

  defrag:
    block: 8
    palette: defrag
    free: 0.4
    scatter: 0.35
    title: Defragmenting Drive C
