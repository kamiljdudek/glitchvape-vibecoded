name: crt-terminal
title: Green phosphor monitor, close up

# Monochrome by construction: the gradient map collapses the image to one hue
# before anything else runs, so the grille and scanlines are shaping a
# single-colour signal rather than tinting a colour one.

output:
  max_dim: 1400

effects:
  downsample:
    factor: 3
    filter: point

  grade:
    saturation: 0
    contrast: 30
    gamma: 0.85

  gradient_map:
    name: crt
    strength: 1.0

  bloom:
    threshold: 45
    radius: 18
    strength: 1.1
    tint: '#39FF14'

    # The glow swelling and the focus below softening are one event, not two:
    # more beam current makes the spot brighter and wider at the same time.
    # Both are excursions, so they share a phase without being told to.
    pulse: 0.15

  softness:
    blur: 1.2
    sharpen: 0.8
    radius: 2
    pulse: 0.2

  scanlines:
    opacity: 0.45
    spacing: 3
    thickness: 1
    softness: 1

    # Six rather than three. The offset is whole pixels, so at a spacing of
    # three a drift of three has only four positions to be in across a loop
    # and the crawl steps rather than slides.
    drift: 6

  grille:
    width: 2
    strength: 0.2
    brighten: 1.2

  grain:
    amount: 0.05
    shadow_bias: 0.5
    mono: 1

  curvature:
    amount: 0.075
    zoom: 1.1

  # A working monitor, so barely there -- enough that the picture is never
  # quite still, not enough to read as a fault.
  flicker:
    amount: 0.04
    rate: 3

  glare:
    strength: 0.12
    angle: 40

  vignette:
    strength: 0.6
    size: 1.25
