# Builds every package this project ships, on every commit to main: the three
# .deb files, the three .rpm files and the source RPM, each uploaded as an
# artifact.
#
# All of it from the tarball `make dist` writes, which is the point of doing
# it here at all -- a file the tarball failed to include is a build failure in
# CI rather than a package that is quietly missing something -- and both
# packagings run the suite on the way through, the RPM in %check and the .deb
# in override_dh_auto_test.
#
# Each packaging is built in a container of the distribution it is for --
# debian:trixie for the .debs, fedora:latest for the RPMs -- and each installs
# its build-dependencies from its own packaging file rather than from a list
# repeated here. Both jobs therefore need `ubuntu-latest` rather than
# `ubuntu-slim`: a slim job is itself an unprivileged container and cannot
# start one.
#
# Building either one on the runner instead was tried and neither works. The
# RPMs need %{perl_vendorlib} supplied by hand and the BuildRequires list
# stood down with --nodeps, which builds *an* rpm without exercising the spec
# anybody will actually build. The .debs need ImageMagick 7, and Ubuntu 24.04
# -- which is what ubuntu-slim is -- ships version 6.

name: packages

on:
  push:
    branches: [main]

# A second push to main makes the first one's packages uninteresting.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # The three .deb packages
  #
  # In a Debian container, for the same reason the RPMs are built in a Fedora
  # one: a package is built on the distribution it is for.
  #
  # Running it on the Ubuntu runner directly was tried and cannot work.
  # ubuntu-slim is Ubuntu 24.04, which ships ImageMagick 6 -- there is no
  # `magick` binary there at all, only `convert`, which GlitchVape::Tools
  # finds and uses -- and five tests fail under it. `--check-deps` reports
  # "ImageMagick major version: 6" and says so plainly. Skipping the suite
  # with DEB_BUILD_OPTIONS=nocheck would make the job green and would mean
  # nothing, and a .deb resolved against Ubuntu's versions was never the
  # right artefact anyway.
  deb:
    name: deb
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      # Before the checkout: the base image has neither git nor make. Only
      # enough to check out and to ask apt what the build needs -- the
      # build-dependencies themselves come from debian/control, below.
      - name: Install enough to check out
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git make perl dpkg-dev

      - uses: actions/checkout@v4

      # The Build-Depends list lives in package/debian/control and nowhere
      # else. apt reads it straight out of a directory holding a debian/ --
      # no deb-src entry needed -- which is the .deb side of what `dnf
      # builddep` does for the spec, and it brings build-essential and
      # fakeroot with it, which dpkg-checkbuilddeps requires of every source
      # package however little there is to compile.
      #
      # Repeating the list here instead was tried, and drifted from
      # debian/control within the hour.
      - name: Install what debian/control asks for
        run: |
          set -eux
          DEBIAN_FRONTEND=noninteractive apt-get build-dep -y ./package

      # Unpacks the tarball into build/, moves package/debian into place and
      # builds there, so nothing is written into the checkout.
      - name: Build
        run: make deb

      - name: What was built
        run: |
          set -eux
          ls -l build/*.deb
          for p in build/*.deb; do dpkg-deb -I "$p"; done

      - uses: actions/upload-artifact@v4
        with:
          name: glitchvape-deb
          path: build/*.deb
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # The source RPM and the three binary RPMs
  #
  # In the container the spec is written for, so %{perl_vendorlib} resolves,
  # perl-generators produces the dependencies, %{?dist} is real and %check
  # runs the suite under the interpreter the package will ship against. There
  # is nothing to arrange but the tools: `make rpms` is the whole build.
  rpm:
    name: rpm
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # Before the checkout: the base image has neither git nor make.
      - name: Install the build tools
        run: |
          set -eux
          dnf -y install git make rpm-build
          # builddep reads the spec, so the BuildRequires list stays in one
          # place. Fedora moved the subcommand to dnf5-plugins; the second
          # form is the dnf4 spelling, for an older base image.
          dnf -y install dnf5-plugins || dnf -y install 'dnf-command(builddep)'

      - uses: actions/checkout@v4

      - name: Install what the spec asks for
        run: dnf -y builddep package/glitchvape.spec

      # Both, from the one tarball: the source package is what a build service
      # is handed, and the binaries are what shows it builds.
      - name: Build
        run: make rpms

      - name: What was built
        run: |
          set -eux
          ls -l build/rpmbuild/SRPMS/*.src.rpm build/rpmbuild/RPMS/*/*.rpm
          for p in build/rpmbuild/RPMS/*/*.rpm; do
            rpm -qip "$p"
            rpm -qp --requires "$p"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: glitchvape-srpm
          path: build/rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: glitchvape-rpm
          path: build/rpmbuild/RPMS/*/*.rpm
          if-no-files-found: error
